name: Periodic Search Engine Sitemap Ping & IndexNow

on:
  schedule:
    # Runs every 6 hours (at minute 0 past every 6th hour)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: read

jobs:
  ping-search-engines:
    name: Ping Google, Bing & IndexNow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Generate Fresh Sitemap
        run: npm run generate-sitemap
        env:
          SITE_URL: https://quickcalculator.app

      - name: Ping Google & Bing Search Consoles
        run: npm run ping:sitemap
        env:
          SITE_URL: https://quickcalculator.app
